<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 2050" width="1550" height="2050">
  <title>CvSU-CCC Ground Floor - Flooring Layout</title>

  <defs>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#f4f1ea"/>
      <path d="M0 0H40M0 0V40" stroke="#e3ddce" stroke-width="1"/>
    </pattern>
    <pattern id="tileCorridor" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#eceee9"/>
      <path d="M0 0H40M0 0V40" stroke="#d6d9d1" stroke-width="1"/>
    </pattern>
    <pattern id="tileYard" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#f7f7f5"/>
      <path d="M0 0H60M0 0V60" stroke="#e6e6e2" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base floor fill for the whole footprint -->
  <path d="M220,420 L640,420 L640,300 L1430,300 L1430,700 L1310,700 L1310,990 L1430,990 L1430,1830 L220,1830 Z
           M100,460 L260,460 L260,730 L100,730 Z"
        fill="url(#tile)" stroke="none"/>

  <!-- Outer building walls -->
  <g fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linejoin="round">
    <path d="M100,460
             L100,730
             L220,730
             L220,1830
             L1430,1830
             L1430,990
             L1310,990
             L1310,700
             L1430,700
             L1430,300
             L640,300
             L640,420
             L260,420
             L260,460
             Z"/>
    <!-- stair block on the far left -->
    <rect x="100" y="460" width="160" height="270"/>
    <!-- detached guard house, bottom right -->
    <rect x="1290" y="1930" width="140" height="110"/>
  </g>

  <!-- Guard house floor fill -->
  <rect x="1290" y="1930" width="140" height="110" fill="url(#tile)"/>

  <!-- ===================== INTERIOR WALLS ===================== -->
  <g fill="none" stroke="#4a4a4a" stroke-width="4">

    <!-- top row of small rooms (lounges / CRs) -->
    <line x1="220" y1="470" x2="1310" y2="470"/>
    <rect x="870" y="420" width="120" height="50"/>
    <rect x="990" y="420" width="120" height="50"/>
    <rect x="1110" y="420" width="120" height="50"/>
    <rect x="1230" y="420" width="90" height="50"/>
    <rect x="1320" y="420" width="110" height="50"/>
    <rect x="1310" y="640" width="120" height="120"/>

    <!-- horizontal corridor band below top row -->
    <line x1="220" y1="640" x2="1310" y2="640"/>

    <!-- central block containing fire-exit stairwell / atrium -->
    <rect x="700" y="770" width="180" height="290"/>

    <!-- left wing: rooms grid (labs, offices) -->
    <line x1="420" y1="770" x2="420" y2="1690"/>
    <line x1="220" y1="1040" x2="700" y2="1040"/>
    <line x1="220" y1="1220" x2="700" y2="1220"/>
    <line x1="220" y1="1400" x2="700" y2="1400"/>
    <line x1="220" y1="1580" x2="700" y2="1580"/>
    <line x1="530" y1="1040" x2="530" y2="1400"/>

    <!-- vertical corridor down the middle -->
    <line x1="880" y1="770" x2="880" y2="1690"/>

    <!-- right wing upper block (management/clinic/canteen) -->
    <line x1="1030" y1="700" x2="1030" y2="990"/>
    <line x1="1170" y1="700" x2="1170" y2="990"/>
    <line x1="880" y1="850" x2="1310" y2="850"/>

    <!-- right wing lower block (offices / classrooms) -->
    <line x1="880" y1="1040" x2="1430" y2="1040"/>
    <line x1="1000" y1="1040" x2="1000" y2="1230"/>
    <line x1="1140" y1="1040" x2="1140" y2="1230"/>
    <line x1="1280" y1="1040" x2="1280" y2="1230"/>
    <line x1="880" y1="1230" x2="1430" y2="1230"/>

    <!-- lower horizontal corridor -->
    <line x1="220" y1="1400" x2="880" y2="1400" stroke-width="4"/>
    <line x1="220" y1="1690" x2="1430" y2="1690"/>

    <!-- bottom classroom row -->
    <line x1="1030" y1="1690" x2="1030" y2="1830"/>
    <line x1="1240" y1="1400" x2="1240" y2="1690"/>
    <line x1="1090" y1="1400" x2="1090" y2="1690"/>
  </g>

  <!-- Corridor floor tint (open circulation areas) -->
  <g fill="url(#tileCorridor)" stroke="none" opacity="0.9">
    <rect x="220" y="470" width="1090" height="170"/>
    <rect x="700" y="1400" width="180" height="290"/>
    <rect x="220" y="1400" width="1210" height="290"/>
  </g>

  <!-- Redraw wall strokes over tint so lines stay crisp -->
  <g fill="none" stroke="#4a4a4a" stroke-width="4">
    <line x1="220" y1="470" x2="1310" y2="470"/>
    <line x1="220" y1="640" x2="1310" y2="640"/>
    <line x1="220" y1="1400" x2="1430" y2="1400"/>
    <line x1="220" y1="1690" x2="1430" y2="1690"/>
  </g>

  <!-- Bottom open yard -->
  <rect x="220" y="1830" width="1210" height="210" fill="url(#tileYard)" stroke="#2b2b2b" stroke-width="6"/>
  <line x1="220" y1="1830" x2="1430" y2="1830" stroke="#4a4a4a" stroke-width="4"/>

</svg>
